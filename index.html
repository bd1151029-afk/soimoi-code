<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>罕玉梅 | 個人簡歷</title>
    <!-- 引入 Tailwind CSS 以進行快速且專業的樣式設計 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'LiHei Pro', 'Microsoft JhengHei', sans-serif;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-pink-400 via-purple-400 to-indigo-500">

    <!-- 主容器 -->
    <div class="max-w-sm w-full bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8 text-center transform transition duration-500 hover:scale-105">
        
        <!-- 個人照片放置區 -->
        <div class="w-32 h-32 mx-auto mb-5 rounded-full p-1 bg-gradient-to-tr from-pink-500 to-purple-500 shadow-lg">
            <!-- 若要換成您的真實照片，請將下方 img 的 src 網址替換成您的照片路徑 -->
            <img src="https://placehold.co/400x400/f8fafc/a855f7?text=Photo" alt="個人照片" class="w-full h-full object-cover rounded-full border-4 border-white">
        </div>

        <!-- 標題與簡介區塊 -->
        <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-500 mb-2">罕玉梅</h1>
        <p class="text-sm text-gray-500 font-bold mb-4">黎明技術學院 數位多媒體系</p>
        <p class="text-gray-700 italic font-medium mb-6">「喜歡簡單生活」</p>

        <!-- 興趣與技能標籤 -->
        <div class="flex flex-wrap justify-center gap-2 mb-8">
            <span class="px-4 py-1.5 bg-pink-100 text-pink-600 rounded-full text-sm font-bold shadow-sm">讀書</span>
            <span class="px-4 py-1.5 bg-pink-100 text-pink-600 rounded-full text-sm font-bold shadow-sm">睡覺</span>
            <span class="px-4 py-1.5 bg-purple-100 text-purple-600 rounded-full text-sm font-bold shadow-sm">畫畫</span>
        </div>

        <!-- 聯絡方式區塊 -->
        <div class="space-y-3 text-sm text-gray-700 bg-gray-50 p-5 rounded-2xl border border-gray-100">
            <div class="flex items-center justify-center gap-2">
                <svg class="w-5 h-5 text-purple-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                <a href="mailto:1151025@mail.lit.edu.tw.tw" class="hover:text-purple-600 transition-colors break-all">1151025@mail.lit.edu.tw.tw</a>
            </div>
            <div class="flex items-center justify-center gap-2">
                <svg class="w-5 h-5 text-green-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                <span class="font-medium">0808536071</span>
            </div>
            <div class="flex items-center justify-center gap-2">
                <svg class="w-5 h-5 text-pink-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" rx="5" ry="5"></rect><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37zM17.5 6.5h.01"></path></svg>
                <span class="font-medium">Panida</span>
            </div>
        </div>

    </div>

</body>
</html>
